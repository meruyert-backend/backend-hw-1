<!DOCTYPE html>
<html>
<head>
    <title>Mini CRM</title>
    <style>
        body {
            font-family: Arial;
            margin: 40px;
        }
        input {
            margin: 5px;
            padding: 8px;
        }
        button {
            padding: 8px 12px;
            margin: 5px;
        }
        table {
            border-collapse: collapse;
            margin-top: 20px;
        }
        td, th {
            border: 1px solid #ccc;
            padding: 8px;
        }
    </style>
</head>

<body>

<h1>Mini CRM</h1>

<!-- REGISTER -->
<h2>Register</h2>
<input id="email" placeholder="email">
<input id="password" type="password" placeholder="password">
<button onclick="register()">Register</button>

<!-- LOGIN -->
<h2>Login</h2>
<button onclick="login()">Login</button>

<!-- CLIENT -->
<h2>Add Client</h2>
<input id="client_name" placeholder="client name">
<button onclick="addClient()">Add Client</button>

<h2>Clients List</h2>
<button onclick="getClients()">Load Clients</button>

<table id="clients_table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
let token = ""

async function register() {
    await fetch('/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        })
    })
    alert("Registered")
}

async function login() {
    let res = await fetch('/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        })
    })

    let data = await res.json()
    token = data.access_token

    alert("Logged in")
}

async function addClient() {
    await fetch('/clients/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
        },
        body: JSON.stringify({
            name: document.getElementById('client_name').value
        })
    })

    alert("Client added")
}

async function getClients() {
    let res = await fetch('/clients/', {
        headers: {
            'Authorization': 'Bearer ' + token
        }
    })

    let data = await res.json()

    let table = document.getElementById("clients_table").getElementsByTagName("tbody")[0]
    table.innerHTML = ""

    data.forEach(client => {
        let row = table.insertRow()
        row.insertCell(0).innerText = client.id
        row.insertCell(1).innerText = client.name
    })
}
</script>

</body>
</html>
